name: validate-pr

# 对标 public-apis：每个 PR 都跑一次校验，不合格直接挡下
on:
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: 校验数据文件
        shell: pwsh
        run: ./scripts/validate.ps1

      - name: 校验渲染脚本可运行（不写回仓库）
        shell: pwsh
        run: |
          ./scripts/render.ps1 -OutPath $env:RUNNER_TEMP/index.html
          if (-not (Test-Path $env:RUNNER_TEMP/index.html)) { throw '渲染未产出文件' }
          Write-Host '渲染校验通过'
