name: weekly-check

on:
  schedule:
    # 每周六 03:00 UTC = 北京时间周六 11:00
    - cron: '0 3 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 数据校验（字段 / URL / 枚举 / 去重）
        shell: pwsh
        run: ./scripts/validate.ps1

      - name: 上游更新检测（star / push 时间 / 归档状态）
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/sync-upstream.ps1 -Token $env:GH_TOKEN

      - name: 链接体检（境外环境，无响应判失效 + 异地复核）
        shell: pwsh
        run: ./scripts/check_links.ps1 -Runner github-actions -TimeoutSec 12 -SecondOpinion

      - name: 重新渲染 docs/index.html
        shell: pwsh
        run: ./scripts/render.ps1

      - name: 提交体检结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/ docs/ README.md
          if git diff --cached --quiet; then
            echo "本次体检结果与现状一致，跳过提交"
            exit 0
          fi
          git commit -m "chore: 每周体检结果更新"
          git pull --rebase --autostash
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
